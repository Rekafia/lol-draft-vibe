<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LoL Draft</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">⚔</span>
      <span class="brand-name">LoL Draft</span>
    </div>
    <div class="conn" id="conn">
      <span class="conn-dot"></span>
      <span class="conn-text" id="status">Připojuji…</span>
    </div>
  </header>

  <main class="content">
    <section class="hero">
      <h1>Choose your team</h1>
      <div class="divider"></div>
    </section>

    <section class="panel join" id="main-panel">
      <label class="field-label" for="name-input">Tvoje jméno</label>
      <input id="name-input" class="text-input" type="text" maxlength="20" placeholder="Napiš svoje jméno" autocomplete="off">

      <button id="btn-random" class="btn btn-random">Random team</button>

      <div class="team-buttons">
        <button id="btn-blue" class="btn btn-blue">Blue team</button>
        <button id="btn-red" class="btn btn-red">Red team</button>
      </div>

      <p id="join-result" class="join-result"></p>
    </section>
  </main>

  <footer class="footer">
    LoL Draft Build-Off · Vibe Coding
  </footer>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
